services:
  sverdrup:
    build: .
    container_name: sverdrup
    # Accounts, keys and profiles come from .env; see .env.example.
    env_file: .env
    environment:
      - DB_PATH=/data/sverdrup.db
    volumes:
      - sverdrup-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sverdrup-data:
    driver: local
