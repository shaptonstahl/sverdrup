services:
  sverdrup:
    build: .
    container_name: sverdrup
    environment:
      - NEXTDNS_API_KEY=${NEXTDNS_API_KEY}
      - NEXTDNS_PROFILE_ID=${NEXTDNS_PROFILE_ID}
      - NEXTDNS_API_URL=${NEXTDNS_API_URL:-https://api.nextdns.io}
      - COLLECTOR_INTERVAL=${COLLECTOR_INTERVAL:-15}
      - PROCESSOR_INTERVAL=${PROCESSOR_INTERVAL:-60}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-8080}
      - DB_PATH=/data/sverdrup.db
    volumes:
      - sverdrup-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  sverdrup-data:
    driver: local
